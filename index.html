
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strona wyłączona</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #10141d;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        padding: 40px;
    }

    h1 {
        font-size: 45px;
        color: #ff4444;
        margin-bottom: 20px;
    }

    p {
        font-size: 18px;
        color: #b8c4d6;
    }

    .icon {
        font-size: 65px;
        margin-bottom: 20px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="icon">🚫</div>
    <h1>https://drive.usercontent.google.com/download?id=15wIZIdCQfdAOqzuWHpogQH7QBjnq1xlD&export=download&authuser=0</h1>
    <p>Ta strona jest obecnie niedostępna.</p>
</div>

</body>
</html>
